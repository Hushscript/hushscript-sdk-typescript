version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The consumer TypeScript floor stays put until the owner moves it on purpose.
      - dependency-name: typescript-floor
      # @types/node tracks the Node floor (engines >=24), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 waits for typescript-eslint, whose peer range stops below 6.1.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /docker
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # init, analyze and upload-sarif must move together or analyze fails.
      codeql:
        patterns: ["github/codeql-action*"]
    commit-message:
      prefix: chore
      include: scope

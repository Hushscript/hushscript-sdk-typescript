version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The consumer TypeScript floor stays put until the owner moves it on purpose.
      - dependency-name: typescript-floor
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /docker
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

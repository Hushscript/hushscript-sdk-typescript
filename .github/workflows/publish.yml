name: publish

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), npm provenance and build attestation
      attestations: write # attest-build-provenance
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Check the tag against package.json and main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(jq -r .version package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "release tag $TAG does not match package.json version v$version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "the commit tagged $TAG is not on main" >&2
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 bundles npm 11, which trusted publishing needs (npm 11.5.1 or newer).
          node-version: "24"
          package-manager-cache: false
      - name: Check the npm version
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "npm $npm_version is older than 11.5.1, which trusted publishing needs" >&2
            exit 1
          fi
      - name: Install and build
        run: npm ci --ignore-scripts && npm run build
      - name: Pack the tarball and write the SBOM
        id: pack
        run: |
          tarball="$(npm pack --ignore-scripts --json | jq -r '.[0].filename')"
          npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - name: Keep the tarball and the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            ${{ steps.pack.outputs.tarball }}
            sbom.cdx.json
          retention-days: 90
      - name: Publish with provenance
        # No registry secret: npm exchanges the job's OIDC token for a short-lived publish token
        # through the trusted publisher attached to the package.
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --provenance --access public

name: publish

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  require-ci:
    name: require successful CI on this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read # query CI workflow runs for this release commit
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        # Main's CI concurrency can cancel this run. A cancellation fails publishing;
        # the owner must re-run CI before re-running the publish workflow.
        run: |
          deadline=$((SECONDS + 3540))
          while (( SECONDS < deadline )); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$COMMIT&per_page=100" --jq '.workflow_runs | sort_by(.id) | last | {status, conclusion}')"
            status="$(jq -r '.status // ""' <<< "$run")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$run")"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                exit 0
              fi
              echo "ci on commit $COMMIT concluded $conclusion; publishing is blocked" >&2
              exit 1
            fi
            sleep 30
          done
          echo "timed out waiting for ci on commit $COMMIT" >&2
          exit 1

  # Builds and packs with read-only permissions and no OIDC token: nothing that runs the project's
  # install and build scripts can mint a registry credential.
  build:
    name: build the tarball
    needs: require-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check the tag against package.json and main
        env:
          TAG: ${{ github.event.release.tag_name }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" != "$COMMIT" ]; then
            echo "the release tag no longer points to the commit verified by CI" >&2
            exit 1
          fi
          version="$(jq -r .version package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "release tag $TAG does not match package.json version v$version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "the commit tagged $TAG is not on main" >&2
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install and build
        run: npm ci --ignore-scripts && npm run build
      - name: Pack the tarball, write the SBOM and the tarball's digest
        id: pack
        run: |
          npm pack --ignore-scripts --json > pack.json
          tarball="$(jq -r '.[0].filename' pack.json)"
          node scripts/check-publish-files.mjs pack.json
          node_modules/.bin/publint "$tarball"
          npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$tarball" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Keep the tarball and the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            ${{ steps.pack.outputs.tarball }}
            sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

  # The only job with an OIDC token. It runs no project code: it checks the tarball against the
  # digest the build job computed, attests it and hands it to npm.
  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), npm provenance and build attestation
      attestations: write # attest-build-provenance
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
      - name: Verify the tarball against the build job's digest
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          actual="$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          if [ -z "$EXPECTED_SHA256" ] || [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "the tarball digest $actual does not match the build job's $EXPECTED_SHA256" >&2
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 bundles npm 11, which trusted publishing needs (npm 11.5.1 or newer).
          node-version: "24"
          package-manager-cache: false
      - name: Check the npm version
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "npm $npm_version is older than 11.5.1, which trusted publishing needs" >&2
            exit 1
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.tarball }}
      - name: Publish with provenance
        # No registry secret: npm exchanges the job's OIDC token for a short-lived publish token
        # through the trusted publisher attached to the package.
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "$TARBALL" --provenance --access public
